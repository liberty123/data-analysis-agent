<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据分析 Agent</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .header {
    background: #16213e;
    padding: 16px 24px;
    border-bottom: 1px solid #0f3460;
    text-align: center;
  }
  .header h1 { font-size: 20px; color: #e94560; }
  .header p { font-size: 13px; color: #888; margin-top: 4px; }
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .message {
    max-width: 80%;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .user-msg {
    align-self: flex-end;
    background: #0f3460;
    padding: 12px 16px;
    border-radius: 12px 12px 4px 12px;
  }
  .agent-msg {
    align-self: flex-start;
    background: #16213e;
    padding: 12px 16px;
    border-radius: 12px 12px 12px 4px;
    border: 1px solid #0f3460;
  }
  .agent-msg .label {
    font-size: 11px;
    color: #e94560;
    margin-bottom: 6px;
    font-weight: bold;
  }
  .tool-msg {
    align-self: flex-start;
    background: #1a1a2e;
    padding: 10px 14px;
    border-radius: 8px;
    border-left: 3px solid #e94560;
    font-size: 13px;
    color: #aaa;
    font-family: "SF Mono", "Fira Code", monospace;
  }
  .tool-msg.success { border-left-color: #4ecca3; }
  .tool-msg.error { border-left-color: #e94560; color: #e94560; }
  .input-area {
    background: #16213e;
    padding: 16px 24px;
    border-top: 1px solid #0f3460;
    display: flex;
    gap: 12px;
  }
  #question-input {
    flex: 1;
    padding: 12px 16px;
    border-radius: 8px;
    border: 1px solid #0f3460;
    background: #1a1a2e;
    color: #e0e0e0;
    font-size: 15px;
    outline: none;
    resize: none;
    font-family: inherit;
  }
  #question-input:focus { border-color: #e94560; }
  #question-input::placeholder { color: #555; }
  #send-btn {
    padding: 12px 24px;
    background: #e94560;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
    white-space: nowrap;
  }
  #send-btn:hover { background: #d63851; }
  #send-btn:disabled { background: #555; cursor: not-allowed; }
  .spinner {
    display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid #e94560;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <h1>📊 数据分析 Agent</h1>
  <p>用自然语言查询和分析你的数据库（Netflix 影片数据）</p>
</div>

<div class="chat-area" id="chat">
  <div class="message agent-msg">
    <div class="label">🤖 Agent</div>
    你好！我可以帮你查询和分析 Netflix 影片数据库。<br>
    试试问我："2020 年上映的电影有哪些？" 或 "统计一下各国的影片数量"
  </div>
</div>

<div class="input-area">
  <textarea id="question-input" rows="2" placeholder="输入你的分析需求..."
            onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();sendMessage()}"></textarea>
  <button id="send-btn" onclick="sendMessage()">发送</button>
</div>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('question-input');
  const btn = document.getElementById('send-btn');

  function addBubble(type, text, label) {
    const div = document.createElement('div');
    div.className = 'message ' + type;
    if (label) div.innerHTML = '<div class="label">' + label + '</div>' + text;
    else div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function addStreamBubble(label) {
    const div = document.createElement('div');
    div.className = 'message agent-msg';
    div.innerHTML = '<div class="label">' + label + '</div>';
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function setLoading(loading) {
    btn.disabled = loading;
    btn.textContent = loading ? '分析中...' : '发送';
  }

  async function sendMessage() {
    const question = input.value.trim();
    if (!question || btn.disabled) return;

    input.value = '';
    addBubble('user-msg', question);
    setLoading(true);

    // 添加加载指示
    const loadingDiv = addBubble('agent-msg', '<span class="spinner"></span>正在分析...', '🤖 Agent');

    try {
      const resp = await fetch('/rag/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          session_id: 'session-' + Date.now(),
          question: question
        })
      });

      loadingDiv.remove();

      if (!resp.ok) {
        const err = await resp.json();
        addBubble('tool-msg error', '错误: ' + (err.detail || '请求失败'));
        return;
      }

      const data = await resp.json();
      addBubble('agent-msg', data.answer, '🤖 Agent');

    } catch (e) {
      loadingDiv.remove();
      addBubble('tool-msg error', '网络错误: ' + e.message);
    } finally {
      setLoading(false);
    }
  }

  input.focus();
</script>
</body>
</html>
